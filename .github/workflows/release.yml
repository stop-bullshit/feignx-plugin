name: Build and release IntelliJ plugin

on:
  push:
    tags:
      - 'v*' # push 以 v 开头的 tag 会触发构建，例如 v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate gradlew
        id: find-gradlew
        run: |
          # 优先用 git ls-files 查找已提交的 gradlew（避免未跟踪文件干扰）
          GRADLEW=$(git ls-files | grep -E '(^|/)(gradlew)$' | head -n1 || true)
          if [ -z "$GRADLEW" ]; then
            echo "::warning::gradlew not found in tracked files; searching filesystem up to depth 6"
            GRADLEW=$(find . -maxdepth 6 -type f -name gradlew | sed 's|^\./||' | head -n1 || true)
          fi
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found in repository. Please add the Gradle Wrapper (gradlew, gradlew.bat, gradle/wrapper/*) or set workflow to run in the correct subdirectory."
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW"
          # 将路径写入输出供后续步骤使用
          echo "path=$GRADLEW" >> $GITHUB_OUTPUT

      - name: Make gradlew executable
        run: chmod +x "${{ steps.find-gradlew.outputs.path }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build plugin (buildPlugin)
        run: |
          set -euo pipefail
          # -p feignx 假定项目在 feignx 子目录；若不是请移除 -p 或调整子目录
          "${{ steps.find-gradlew.outputs.path }}" -p feignx clean buildPlugin --no-daemon --warning-mode=all

      - name: List distributions
        run: ls -la feignx/build/distributions || true

      - name: Ensure artifact exists
        id: check-artifact
        run: |
          set -e
          FILES=(feignx/build/distributions/*.zip)
          if [ ! -e "${FILES[0]}" ]; then
            echo "::error::No distribution ZIP found under feignx/build/distributions. Build may have failed or output path is different."
            exit 1
          fi
          echo "found=1" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload plugin artifact
        if: steps.check-artifact.outputs.found == '1'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          files: feignx/build/distributions/*.zip
